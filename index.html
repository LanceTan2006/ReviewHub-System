<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- ═══════════════════════════════════════════════
         PRIMARY META
    ═══════════════════════════════════════════════ -->
    <title>ReviewHub - Meliora Learning Hub | AI-Powered Exam Preparation</title>
    <meta name="description" content="ReviewHub by Meliora Learning Hub — AI-powered exam preparation for PRC licensure, college entrance, civil service, IELTS, and working students." />
    <meta name="keywords" content="review center, board exam, PRC licensure, college entrance, IELTS, civil service, AI reviewer, Philippines" />
    <meta name="author" content="Meliora Learning Hub" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="ReviewHub - Meliora Learning Hub | AI-Powered Exam Preparation" />
    <meta property="og:description" content="AI-powered exam preparation platform for college students, review centers, and working students in the Philippines." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ReviewHub — Meliora Learning Hub" />
    <meta property="og:locale" content="en_PH" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReviewHub — AI-Powered Exam Preparation" />
    <meta name="twitter:description" content="Prepare Smarter. Learn Better. Achieve More." />

    <!-- Theme -->
    <meta name="theme-color" content="#3498DB" />
    <meta name="msapplication-TileColor" content="#3498DB" />

    <link rel="canonical" href="https://LanceTan2006.github.io/ReviewHub-System/" />

    <!-- ═══════════════════════════════════════════════
         FONTS
    ═══════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Bootstrap Icons 1.11 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- ═══════════════════════════════════════════════
         JQUERY — must load before jQuery Mobile
    ═══════════════════════════════════════════════ -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>

    <!-- ═══════════════════════════════════════════════
         JQUERY MOBILE CONFIG — MUST be before jQM JS loads
         Disables all auto-enhancement so React keeps full DOM control.
         data-role="none" on body + root div handles the rest.
    ═══════════════════════════════════════════════ -->
    <script>
      $(document).on("mobileinit", function () {
        $.mobile.ajaxEnabled          = false;
        $.mobile.hashListeningEnabled = false;
        $.mobile.pushStateEnabled     = false;
        $.mobile.linkBindingEnabled   = false;
        $.mobile.autoInitializePage   = false;  /* ← key: stops jQM page init */
        $.mobile.ignoreContentEnabled = true;   /* ← key: skip data-role="none" elements */
      });
    </script>

    <!-- ═══════════════════════════════════════════════
         JQUERY MOBILE CSS — load after config script
    ═══════════════════════════════════════════════ -->
    <link rel="stylesheet"
          href="https://code.jquery.com/mobile/1.5.0-rc1/jquery.mobile-1.5.0-rc1.min.css" />

    <!-- Override jQM global resets that break React layout -->
    <style>
      /* Stop jQM from touching the body background / padding */
      body.ui-mobile, .ui-mobile body { background: #F4FAFD !important; padding: 0 !important; }
      /* Keep the React root visible — jQM hides non-page divs by default */
      #root { display: block !important; visibility: visible !important; opacity: 1 !important; }
      /* Strip jQM page chrome from our app shell */
      .ui-page  { background: transparent !important; }
      .ui-content { padding: 0 !important; margin: 0 !important; }
      /* Prevent jQM button resets overriding Tailwind buttons */
      .ui-btn   { text-shadow: none !important; font-family: inherit !important; margin: 0 !important; }
    </style>

    <!-- ═══════════════════════════════════════════════
         JQUERY MOBILE JS — after config + CSS
    ═══════════════════════════════════════════════ -->
    <script src="https://code.jquery.com/mobile/1.5.0-rc1/jquery.mobile-1.5.0-rc1.min.js"></script>
  </head>

  <!--
    data-role="none" tells jQuery Mobile:
    "Do NOT auto-enhance anything inside here."
    This is the official jQM way to coexist with other frameworks.
  -->
  <body data-role="none" class="bg-[#F4FAFD] text-[#2C3E50] antialiased">

    <!-- Skip to content (accessibility) -->
    <a href="#main-content"
       class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-[9999] focus:px-4 focus:py-2 focus:bg-[#3498DB] focus:text-white focus:rounded-lg focus:font-semibold focus:shadow-lg">
      Skip to main content
    </a>

    <!-- React SPA root — data-role="none" prevents jQM page wrapping -->
    <div id="root" data-role="none"></div>

    <!-- Vite / React entry -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- ═══════════════════════════════════════════════
         JQUERY ENHANCEMENTS
         All DOM-ready scripts for interactivity.
    ═══════════════════════════════════════════════ -->
    <script>
      $(function () {

        /* ─────────────────────────────────────────────
           1. SMOOTH SCROLL — native anchor hash links
        ───────────────────────────────────────────── */
        $(document).on("click", 'a[href^="#"]', function (e) {
          var target = $($(this).attr("href"));
          if (target.length) {
            e.preventDefault();
            $("html, body").animate({ scrollTop: target.offset().top - 80 }, 500, "swing");
          }
        });

        /* ─────────────────────────────────────────────
           2. SCROLL-SPY — active nav link highlight
        ───────────────────────────────────────────── */
        var sections = ["features-section", "packages-section", "about-section", "contact-section"];
        $(window).on("scroll.spy", function () {
          var scrollY = $(this).scrollTop() + 100;
          sections.forEach(function (id) {
            var el = document.getElementById(id);
            if (el) {
              var top    = $(el).offset().top;
              var bottom = top + $(el).outerHeight();
              var $link  = $('[data-spy-target="' + id + '"]');
              if (scrollY >= top && scrollY < bottom) {
                $link.addClass("rh-nav-active");
              } else {
                $link.removeClass("rh-nav-active");
              }
            }
          });
        });

        /* ─────────────────────────────────────────────
           3. CONTACT FORM — submit validation
        ───────────────────────────────────────────── */
        $(document).on("submit", "#rh-contact-form", function (e) {
          var valid = true;
          $(this).find("[data-validate]").each(function () {
            var rule = $(this).attr("data-validate");
            var val  = $(this).val().trim();
            var $err = $(this).siblings(".rh-field-error");
            if (rule === "required" && !val) {
              $err.text("This field is required.").show();
              $(this).addClass("rh-input-error");
              valid = false;
            } else if (rule === "email" && val && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) {
              $err.text("Please enter a valid email address.").show();
              $(this).addClass("rh-input-error");
              valid = false;
            } else if (rule === "tel" && val && !/^[\d\s\+\-\(\)]{7,20}$/.test(val)) {
              $err.text("Please enter a valid phone number.").show();
              $(this).addClass("rh-input-error");
              valid = false;
            } else {
              $err.hide().text("");
              $(this).removeClass("rh-input-error");
            }
          });
          if (!valid) e.preventDefault();
        });

        /* ─────────────────────────────────────────────
           4. CONTACT FORM — live blur validation
        ───────────────────────────────────────────── */
        $(document).on("blur", "#rh-contact-form [data-validate]", function () {
          var rule = $(this).attr("data-validate");
          var val  = $(this).val().trim();
          var $err = $(this).siblings(".rh-field-error");
          if (rule === "required" && !val) {
            $err.text("This field is required.").show();
            $(this).addClass("rh-input-error");
          } else if (rule === "email" && val && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) {
            $err.text("Please enter a valid email address.").show();
            $(this).addClass("rh-input-error");
          } else {
            $err.hide().text("");
            $(this).removeClass("rh-input-error");
          }
        });

        /* ─────────────────────────────────────────────
           5. TOUCH FEEDBACK — jQuery Mobile style
        ───────────────────────────────────────────── */
        $(document).on("touchstart", ".rh-touch-btn", function () {
          $(this).addClass("rh-touch-active");
        }).on("touchend touchcancel", ".rh-touch-btn", function () {
          $(this).removeClass("rh-touch-active");
        });

        /* ─────────────────────────────────────────────
           6. NAVBAR — hide on scroll down (mobile only)
        ───────────────────────────────────────────── */
        var lastScrollY = 0;
        $(window).on("scroll.navbar", function () {
          var current = $(this).scrollTop();
          if ($(window).width() < 1024) {
            if (current > lastScrollY && current > 120) {
              $(".rh-sticky-navbar").addClass("rh-navbar-hidden");
            } else {
              $(".rh-sticky-navbar").removeClass("rh-navbar-hidden");
            }
          }
          lastScrollY = current;
        });

        /* ─────────────────────────────────────────────
           7. BACK-TO-TOP — show/hide + smooth scroll
        ───────────────────────────────────────────── */
        $(window).on("scroll.btt", function () {
          if ($(this).scrollTop() > 400) {
            $("#rh-back-to-top").fadeIn(300);
          } else {
            $("#rh-back-to-top").fadeOut(300);
          }
        });
        $("#rh-back-to-top").on("click", function () {
          $("html, body").animate({ scrollTop: 0 }, 500, "swing");
        });

        /* ─────────────────────────────────────────────
           8. PACKAGE CARD — jQuery Mobile taphold highlight
        ───────────────────────────────────────────── */
        $(document).on("taphold", ".rh-pkg-card", function () {
          $(this).toggleClass("rh-pkg-highlighted");
        });

        /* ─────────────────────────────────────────────
           9. MODAL ESCAPE KEY — accessibility
        ───────────────────────────────────────────── */
        $(document).on("keydown", function (e) {
          if (e.key === "Escape") {
            $("[role='dialog']").find("[data-modal-close]").trigger("click");
          }
        });

      }); // end $(function)
    </script>
  </body>
</html>
